name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (pyflakes + syntax)
        run: ruff check .

      - name: Type check (ty)
        # Informational for now — `ty` is pre-1.0 and the codebase (a fork)
        # still has type gaps. Surfaces issues in the log without blocking
        # PRs. Drop continue-on-error once the tree is clean.
        continue-on-error: true
        run: ty check

      - name: Pytest (with coverage)
        env:
          # Belt-and-suspenders: conftest blanks these too.
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          TZ: UTC
          PYTHONHASHSEED: "0"
        # Coverage is reported (term-missing) for visibility. No --cov-fail-under
        # yet — the fork's tree is still thinly covered; flip on a floor once the
        # core modules (credential_pool, transports, gateway) climb.
        run: >-
          pytest -m "not integration"
          --cov=agent --cov=gateway --cov=talaria_cli --cov=tools
          --cov=acp_adapter --cov=cron --cov-report=term-missing

      - name: Dependency audit (pip-audit)
        # Informational for now — surfaces known-vuln dependencies in the log
        # without blocking PRs. Drop continue-on-error once advisories are
        # triaged (pin/upgrade or add a documented --ignore-vuln).
        continue-on-error: true
        run: pip-audit --progress-spinner off
