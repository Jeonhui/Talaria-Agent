#
# docker-compose.yml for Talaria Agent
#
# Usage:
#   TALARIA_UID=$(id -u) TALARIA_GID=$(id -g) docker compose up -d
#
# Set TALARIA_UID / TALARIA_GID to the host user that owns ~/.talaria so
# files created inside the container stay readable/writable on the host.
# The entrypoint remaps the internal `talaria` user to these values via
# usermod/groupmod + gosu.
#
# Security notes:
#   - Bot tokens and provider API keys live in ~/.talaria/.env on the host
#     and are bind-mounted in. Treat that file like any other secret file.
#   - The gateway's OpenAI-compatible API server is OFF by default. If you
#     uncomment API_SERVER_HOST=0.0.0.0 below, API_SERVER_KEY is mandatory.
#
services:
  gateway:
    build: .
    image: talaria-agent:0.2.1
    container_name: talaria
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/.talaria:/opt/data
    environment:
      - TALARIA_UID=${TALARIA_UID:-10000}
      - TALARIA_GID=${TALARIA_GID:-10000}
      # Optional: expose the OpenAI-compatible API server beyond localhost.
      # Uncomment BOTH lines (API_SERVER_KEY is mandatory for non-loopback).
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
    command: ["gateway", "run"]
