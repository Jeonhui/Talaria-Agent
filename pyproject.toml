[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talaria-agent"
version = "0.2.0"
description = "A lean personal assistant for Discord, Slack, Telegram, CLI, and optional MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jeonhui" }]
license = { text = "MIT" }
dependencies = [
  # Core — pinned to known-good ranges to limit supply chain attack surface
  "openai>=2.21.0,<3",
  "anthropic>=0.39.0,<1",
  "python-dotenv>=1.2.1,<2",
  "fire>=0.7.1,<1",
  "httpx[socks]>=0.28.1,<1",
  "rich>=14.3.3,<15",
  "tenacity>=9.1.4,<10",
  "pyyaml>=6.0.2,<7",
  "requests>=2.33.0,<3",  # CVE-2026-25645
  "jinja2>=3.1.5,<4",
  "pydantic>=2.12.5,<3",
  # Terminal UI building blocks (prompt_toolkit: pickers, key bindings, ANSI)
  "prompt_toolkit>=3.0.52,<4",
  # Tools
  # Cron scheduler (built-in feature — scheduled cron/interval jobs use croniter).
  "croniter>=6.0.0,<7",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]>=2.12.0,<3",  # CVE-2026-32597
]

[project.optional-dependencies]
dev = ["debugpy>=1.8.0,<2", "pytest>=9.0.2,<10", "pytest-asyncio>=1.3.0,<2", "pytest-xdist>=3.0,<4", "pytest-cov>=5.0,<8", "pip-audit>=2.7,<3", "mcp>=1.2.0,<2", "ty>=0.0.1a29,<0.0.22", "ruff"]
# Messaging platforms — Discord, Slack, Telegram only.
messaging = [
  "discord.py>=2.7.1,<3",
  "slack-bolt>=1.18.0,<2",
  "slack-sdk>=3.27.0,<4",
  "python-telegram-bot[webhooks]>=22.6,<23",
  "aiohttp>=3.13.3,<4",
]
cli = ["simple-term-menu>=1.0,<2"]
pty = [
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
]
mcp = ["mcp>=1.2.0,<2"]
termux = [
  "python-telegram-bot[webhooks]>=22.6,<23",
  "talaria-agent[cli]",
  "talaria-agent[pty]",
  "talaria-agent[mcp]",
]
all = [
  "talaria-agent[messaging]",
  "talaria-agent[cli]",
  "talaria-agent[pty]",
  "talaria-agent[mcp]",
]

[project.scripts]
talaria = "talaria_cli.main:main"
talaria-agent = "run_agent:main"

[tool.setuptools]
py-modules = ["run_agent", "model_tools", "toolsets", "cli_config", "talaria_constants", "talaria_state", "talaria_time", "talaria_logging", "utils"]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "tools", "tools.*", "talaria_cli", "gateway", "gateway.*", "cron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, network, Docker, etc.)",
]
addopts = "-m 'not integration' -n auto"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ty.src]
exclude = ["**"]

[[tool.ty.overrides]]
include = ["**"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
invalid-method-override = "ignore"
invalid-assignment = "ignore"
not-iterable = "ignore"

[tool.ruff]
target-version = "py311"
line-length = 120
# Generated / vendored / data dirs that shouldn't be linted.
extend-exclude = ["skills", "models-dev-upstream", "ref", "examples"]

[tool.ruff.lint]
# Pyflakes (F) catches real bugs — undefined names, unused imports, bad
# f-strings, duplicate dict keys — and E9 catches syntax errors. We do NOT
# enable the full default set: the codebase intentionally uses non-top-level
# imports (E402) and other patterns that would be noise. "I" (isort) keeps
# import blocks ordered and grouped — fully autofixable, so it never blocks a
# real PR, only nudges import hygiene.
select = ["F", "E9", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests redefine fixtures and import for side effects.
"tests/*" = ["F811", "F401", "F403", "F405"]

[tool.uv]
exclude-newer = "7 days"
